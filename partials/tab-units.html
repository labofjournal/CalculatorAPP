<section class="tab-panel" id="tab-units" role="tabpanel" aria-labelledby="tab-units-button" data-panel="units" hidden>
  <div class="units-card">
    <div class="calculator-topline"><span class="mini-label">UNIT CONVERTER</span><span class="mode-pill"><i></i> Live conversion</span></div>
    <div class="unit-intro"><h3>Konversi tanpa repot.</h3><p>Pilih kategori dan satuan untuk mendapatkan hasil secara instan.</p></div>
    <label class="field-label" for="unit-category">Kategori</label>
    <select class="text-field select-field" id="unit-category"></select>
    <label class="field-label" for="unit-amount">Nilai yang dikonversi</label>
    <input class="text-field amount-field" id="unit-amount" type="number" inputmode="decimal" value="1" step="any">
    <div class="unit-selectors">
      <div><label class="field-label" for="unit-from">Dari</label><select class="text-field select-field" id="unit-from"></select></div>
      <button class="swap-button" id="unit-swap" type="button" aria-label="Tukar satuan">⇄</button>
      <div><label class="field-label" for="unit-to">Ke</label><select class="text-field select-field" id="unit-to"></select></div>
    </div>
    <div class="conversion-result"><div><span class="mini-label">HASIL KONVERSI</span><strong id="unit-result">1</strong><span id="unit-result-unit">meter</span></div><span class="result-arrow">↗</span></div>
    <p class="conversion-note" id="unit-note">Konversi dihitung langsung di browser Anda.</p>
  </div>
</section>
