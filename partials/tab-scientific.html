<section class="tab-panel" id="tab-scientific" role="tabpanel" aria-labelledby="tab-scientific-button" data-panel="scientific" hidden>
  <div class="calculator-card scientific-card">
    <div class="calculator-topline"><span class="mini-label">SCIENTIFIC CALCULATOR</span><div class="angle-toggle" aria-label="Mode sudut"><button type="button" class="angle-button active" data-angle="DEG" aria-pressed="true">DEG</button><button type="button" class="angle-button" data-angle="RAD" aria-pressed="false">RAD</button></div></div>
    <div class="display-area" aria-live="polite"><div class="display-expression" data-expression>0</div><div class="display-result" data-result>0</div></div>
    <div class="keypad scientific-keypad" aria-label="Tombol kalkulator scientific">
      <button class="calc-key key-function" data-insert="sin(" type="button">sin</button><button class="calc-key key-function" data-insert="cos(" type="button">cos</button><button class="calc-key key-function" data-insert="tan(" type="button">tan</button><button class="calc-key key-function" data-insert="log(" type="button">log</button><button class="calc-key key-function" data-insert="ln(" type="button">ln</button>
      <button class="calc-key key-function" data-insert="asin(" type="button">sin⁻¹</button><button class="calc-key key-function" data-insert="acos(" type="button">cos⁻¹</button><button class="calc-key key-function" data-insert="atan(" type="button">tan⁻¹</button><button class="calc-key key-function" data-insert="sqrt(" type="button">√</button><button class="calc-key key-function" data-insert="^" type="button">xʸ</button>
      <button class="calc-key key-function" data-insert="pi" type="button">π</button><button class="calc-key key-function" data-insert="e" type="button">e</button><button class="calc-key key-function" data-insert="(" type="button">(</button><button class="calc-key key-function" data-insert=")" type="button">)</button><button class="calc-key key-function" data-insert="!" type="button">x!</button>
      <button class="calc-key" data-key="7" type="button">7</button><button class="calc-key" data-key="8" type="button">8</button><button class="calc-key" data-key="9" type="button">9</button><button class="calc-key key-muted" data-command="delete" type="button">DEL</button><button class="calc-key key-operator" data-key="÷" type="button">÷</button>
      <button class="calc-key" data-key="4" type="button">4</button><button class="calc-key" data-key="5" type="button">5</button><button class="calc-key" data-key="6" type="button">6</button><button class="calc-key key-muted" data-command="clear" type="button">AC</button><button class="calc-key key-operator" data-key="×" type="button">×</button>
      <button class="calc-key" data-key="1" type="button">1</button><button class="calc-key" data-key="2" type="button">2</button><button class="calc-key" data-key="3" type="button">3</button><button class="calc-key key-operator" data-key="−" type="button">−</button><button class="calc-key key-operator" data-key="+" type="button">+</button>
      <button class="calc-key key-muted" data-command="sign" type="button">+/−</button><button class="calc-key" data-key="0" type="button">0</button><button class="calc-key" data-key="." type="button">.</button><button class="calc-key key-muted" data-key="%" type="button">%</button><button class="calc-key key-equals" data-command="equals" type="button">=</button>
    </div>
    <p class="calculator-footnote"><span class="footnote-spark">✦</span> Mendukung trigonometri, logaritma, pangkat, dan faktorial.</p>
  </div>
</section>
