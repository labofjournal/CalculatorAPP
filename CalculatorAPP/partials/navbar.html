<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="CalculatorAPP beranda">
      <img src="assets/logo.svg" alt="" width="38" height="38">
      <span>Calculator<span class="brand-accent">APP</span></span>
    </a>
    <div class="header-actions">
      <span class="connection-indicator" id="connection-indicator"><i></i><span>Mode lokal</span></span>
      <div class="account-area">
        <span class="account-label" id="account-label">Belum masuk</span>
        <button class="button button-quiet button-small" id="auth-open" type="button">Masuk / Daftar</button>
        <button class="button button-quiet button-small hidden" id="auth-signout" type="button">Keluar</button>
      </div>
    </div>
  </div>
</header>

<dialog class="auth-dialog" id="auth-dialog" aria-labelledby="auth-title">
  <div class="auth-dialog-inner">
    <button class="dialog-close" id="auth-close" type="button" aria-label="Tutup dialog">×</button>
    <div class="auth-mark"><img src="assets/logo.svg" alt="" width="42" height="42"></div>
    <p class="eyebrow">ACCOUNT CENTER</p>
    <h2 id="auth-title">Selamat datang kembali</h2>
    <p class="auth-subtitle" id="auth-subtitle">Masuk untuk menyinkronkan profil dan riwayat kalkulasi Anda.</p>
    <form id="auth-form">
      <label class="field-label hidden" id="name-field-label" for="auth-name">Nama lengkap</label>
      <input class="text-field hidden" id="auth-name" name="name" type="text" autocomplete="name" placeholder="Nama Anda" maxlength="80">
      <label class="field-label" for="auth-email">Email</label>
      <input class="text-field" id="auth-email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
      <label class="field-label" for="auth-password">Kata sandi</label>
      <input class="text-field" id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter" minlength="6" required>
      <p class="auth-error hidden" id="auth-error" role="alert"></p>
      <button class="button button-primary auth-submit" id="auth-submit" type="submit">Masuk ke akun</button>
    </form>
    <button class="text-action" id="auth-reset" type="button">Lupa kata sandi?</button>
    <div class="auth-switch"><span id="auth-switch-text">Belum punya akun?</span> <button class="text-action" id="auth-switch" type="button">Buat akun</button></div>
    <p class="auth-privacy">Dengan melanjutkan, akun Anda dikelola secara aman oleh Firebase Authentication.</p>
  </div>
</dialog>
