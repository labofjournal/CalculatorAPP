<section class="tab-panel active" id="tab-basic" role="tabpanel" aria-labelledby="tab-basic-button" data-panel="basic">
  <div class="calculator-card basic-card">
    <div class="calculator-topline"><span class="mini-label">STANDARD CALCULATOR</span><span class="mode-pill"><i></i> Ready</span></div>
    <div class="display-area" aria-live="polite">
      <div class="display-expression" data-expression>0</div>
      <div class="display-result" data-result>0</div>
    </div>
    <div class="keypad basic-keypad" aria-label="Tombol kalkulator basic">
      <button class="calc-key key-muted" data-command="clear" type="button">AC</button>
      <button class="calc-key key-muted" data-command="delete" type="button">DEL</button>
      <button class="calc-key key-muted" data-key="%" type="button">%</button>
      <button class="calc-key key-operator" data-key="÷" type="button">÷</button>
      <button class="calc-key" data-key="7" type="button">7</button><button class="calc-key" data-key="8" type="button">8</button><button class="calc-key" data-key="9" type="button">9</button><button class="calc-key key-operator" data-key="×" type="button">×</button>
      <button class="calc-key" data-key="4" type="button">4</button><button class="calc-key" data-key="5" type="button">5</button><button class="calc-key" data-key="6" type="button">6</button><button class="calc-key key-operator" data-key="−" type="button">−</button>
      <button class="calc-key" data-key="1" type="button">1</button><button class="calc-key" data-key="2" type="button">2</button><button class="calc-key" data-key="3" type="button">3</button><button class="calc-key key-operator" data-key="+" type="button">+</button>
      <button class="calc-key key-muted" data-command="sign" type="button">+/−</button><button class="calc-key" data-key="0" type="button">0</button><button class="calc-key" data-key="." type="button">.</button><button class="calc-key key-equals" data-command="equals" type="button">=</button>
    </div>
    <p class="calculator-footnote"><span class="footnote-spark">✦</span> Hasil perhitungan ditambahkan ke riwayat.</p>
  </div>
</section>
